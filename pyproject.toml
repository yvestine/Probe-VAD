[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covas-vad"
version = "1.0.2"
description = "Training-free cumulative ordinal visual anomaly scoring with VideoLLaMA3"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
authors = [{name = "COVAS-VAD Contributors"}]
keywords = [
  "video anomaly detection",
  "vision-language model",
  "zero-shot",
  "ordinal likelihood",
  "VideoLLaMA3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate==0.26.0",
  "av==14.2.0",
  "decord==0.6.0",
  "huggingface-hub==0.30.2",
  "numpy==1.25.2",
  "opencv-python==4.11.0.86",
  "pillow==10.4.0",
  "qwen-vl-utils==0.0.10",
  "scikit-learn==1.1.3",
  "scipy==1.9.3",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "tqdm==4.67.1",
  "transformers==4.46.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff>=0.8"]

[project.scripts]
covas-score = "covas_vad.scoring:main"
covas-eval = "covas_vad.evaluation:cli_main"
covas-validate = "covas_vad.validate_dataset:main"

[project.urls]
Repository = "https://github.com/Rathgrith/COVAS-VAD"

[tool.setuptools.packages.find]
include = ["covas_vad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
